name: Проверка локального инструмента

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-quality:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Получить код
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Проверить синтаксис PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [scriptblock]::Create((Get-Content -LiteralPath .\start.ps1 -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content -LiteralPath .\scripts\ensure-node.ps1 -Raw)) | Out-Null

      - name: Подготовить закреплённый portable Node.js
        id: portable
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $nodeExe = (& .\scripts\ensure-node.ps1 -ProjectRoot $PWD.Path -ForcePortable | Select-Object -Last 1)
          if (-not (Test-Path -LiteralPath $nodeExe -PathType Leaf)) { throw 'Portable Node.js не подготовлен' }
          "node=$nodeExe" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Проверить каталог и JavaScript
        shell: powershell
        run: |
          $nodeExe = '${{ steps.portable.outputs.node }}'
          & $nodeExe --check product-catalog.js
          & $nodeExe --check app.js
          & $nodeExe --check scripts\validate-reference.js
          & $nodeExe scripts\validate-reference.js
          & $nodeExe tests.js
          & $nodeExe runtime-tests.js
          & $nodeExe server-tests.js
