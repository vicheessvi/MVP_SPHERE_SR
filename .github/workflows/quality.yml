name: Проверка локального инструмента

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-quality:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Получить код
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Настроить Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Настроить Node.js для frontend-проверок
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Проверить Python runtime
        shell: powershell
        run: |
          python -m compileall -q mvp_runtime python_tests START_MVP_SPHERE_SR.py
          python -m unittest discover -s python_tests -v

      - name: Проверить интерфейс и Справочник
        shell: powershell
        run: |
          node --check runtime-config.js
          node --check product-catalog.js
          node --check app.js
          node --check tests.js
          node --check runtime\model-catalog.js
          node --check runtime\credential-pool.js
          node --check scripts\validate-reference.js
          node scripts\validate-reference.js
          node tests.js
